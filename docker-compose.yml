services:

  postgres:
    image: postgres:16.16

    security_opt:
      - no-new-privileges:true

    container_name: small_business_postgres

    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  metabase:
    image: metabase/metabase:v0.65.6.4
    security_opt:
      - no-new-privileges:true

    container_name: small_business_metabase
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
