services:

  postgres:
    image: postgres:16

    container_name: small_business_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  metabase:
    image: metabase/metabase:latest
    container_name: small_business_metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data: